<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geis Svozy</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">

    <header class="mb-6">
        <h1 class="text-xl font-black text-slate-800 uppercase">Geis Svozy</h1>
    </header>

    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6">
        <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Aktivovat zákazníka</label>
        <select id="customerSelect" class="w-full bg-gray-50 border rounded-lg p-2 mb-3">
            <option>WIMEX</option><option>SHIPMALL</option><option>ALBI</option><option>DRANA</option>
            <option>V-GARDEN</option><option>GARLAND</option><option>HP TRONIC</option><option>KRPA</option>
            <option>TAMADEX</option><option>Z-TRADE</option><option>HOBRA ŠKOLNÍK</option><option>PENTA</option>
        </select>
        <div class="grid grid-cols-2 gap-2 mb-3">
            <input type="number" id="targetFP" placeholder="Cíl FP" class="border p-2 rounded text-center">
            <input type="number" id="targetKH" placeholder="Cíl KH" class="border p-2 rounded text-center">
        </div>
        <button onclick="addCustomer()" class="w-full bg-[#96c11f] font-bold py-2 rounded-lg">Přidat na přehled</button>
    </div>

    <div id="activeList" class="grid grid-cols-1 gap-4"></div>

    <div id="modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-4 shadow-xl">
            <h2 id="modalTitle" class="text-lg font-black uppercase mb-4">---</h2>
            <select id="driverSelect" class="w-full border p-2 rounded mb-2">
                <option>KINDA</option><option>VRABEC</option><option>DAVID</option><option>BAŽANT</option>
                <option>PARTEL</option><option>KLEIN</option>
            </select>
            <div class="grid grid-cols-2 gap-2 mb-3">
                <input type="number" id="loadFP" placeholder="FP" class="border p-2 rounded">
                <input type="number" id="loadKH" placeholder="KH" class="border p-2 rounded">
            </div>
            <button onclick="saveLoad()" class="w-full bg-[#96c11f] font-bold py-2 rounded-lg mb-4">Potvrdit naložení</button>
            <div id="historyList" class="space-y-2 mb-4 border-t pt-4"></div>
            <button onclick="closeModal()" class="w-full text-gray-500 font-bold">Zavřít</button>
        </div>
    </div>

    <script>
        let targets = JSON.parse(localStorage.getItem('targets')) || [];
        let activeId = null;

        function addCustomer() {
            const customer = document.getElementById('customerSelect').value;
            const fp = parseInt(document.getElementById('targetFP').value) || 0;
            const kh = parseInt(document.getElementById('targetKH').value) || 0;
            targets.push({ id: Date.now(), customer, fp, kh, history: [] });
            update();
        }

        function saveLoad() {
            const t = targets.find(x => x.id === activeId);
            const fp = parseInt(document.getElementById('loadFP').value) || 0;
            const kh = parseInt(document.getElementById('loadKH').value) || 0;
            const driver = document.getElementById('driverSelect').value;
            t.history.push({ id: Date.now(), driver, fp, kh });
            update();
            renderModal(activeId);
        }

        function storno(historyId) {
            const t = targets.find(x => x.id === activeId);
            t.history = t.history.filter(h => h.id !== historyId);
            update();
            renderModal(activeId);
        }

        function update() {
            localStorage.setItem('targets', JSON.stringify(targets));
            const list = document.getElementById('activeList');
            list.innerHTML = targets.map(t => {
                const usedFP = t.history.reduce((a, b) => a + b.fp, 0);
                return `<div onclick="renderModal(${t.id})" class="bg-white p-4 rounded-xl shadow cursor-pointer">
                    <div class="font-bold">${t.customer}</div>
                    <div class="text-sm">Zbývá FP: ${t.fp - usedFP}</div>
                </div>`;
            }).join('');
        }

        function renderModal(id) {
            activeId = id;
            const t = targets.find(x => x.id === id);
            document.getElementById('modalTitle').innerText = t.customer;
            document.getElementById('modal').classList.remove('hidden');
            const hList = document.getElementById('historyList');
            hList.innerHTML = t.history.map(h => `
                <div class="flex justify-between text-sm">
                    ${h.driver}: ${h.fp} FP | ${h.kh} KH
                    <button onclick="storno(${h.id})" class="text-red-500 font-bold">×</button>
                </div>`).join('');
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
        update();
    </script>
</body>
</html>
