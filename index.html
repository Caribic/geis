<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geis - Dispečink Svozů</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden-tab { display: none; }
        .active-tab { display: block; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-900 pb-24">

    <header class="bg-white text-slate-900 p-4 shadow-sm sticky top-0 z-10 border-b-4 border-[#96c11f] flex justify-between items-center">
        <h1 class="text-lg font-black uppercase">Geis Svozy</h1>
        <p class="text-[10px] text-slate-500 font-bold uppercase" id="currentDateDisplay"></p>
    </header>

    <main id="tab-counter" class="active-tab p-4 space-y-5">
        <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-200">
            <h2 class="text-xs font-bold text-gray-400 uppercase mb-3">Aktivovat zákazníka</h2>
            <div class="grid grid-cols-1 gap-3 mb-3">
                <select id="targetCustomer" class="w-full bg-gray-50 border rounded-lg p-2 text-sm h-10"></select>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="targetFP" placeholder="Cíl FP" class="w-full bg-gray-50 border rounded-lg p-2 text-sm text-center font-bold">
                    <input type="number" id="targetKH" placeholder="Cíl KH" class="w-full bg-gray-50 border rounded-lg p-2 text-sm text-center font-bold">
                </div>
            </div>
            <button onclick="createDailyTarget()" class="w-full bg-[#96c11f] font-bold py-2.5 rounded-lg text-sm">Přidat na přehled</button>
        </div>

        <button onclick="undoLastAction()" class="w-full bg-red-50 text-red-600 text-[10px] font-bold py-2 rounded-lg border border-red-200">
            ↶ ZPĚT (Smazat poslední nakládku)
        </button>

        <div id="activeCountersList" class="grid grid-cols-2 gap-3"></div>
    </main>

    <div id="detailsModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md shadow-xl flex flex-col max-h-[90vh]">
            <div class="bg-slate-800 p-4 text-white flex justify-between">
                <h4 id="modalCustomerName" class="font-black uppercase">---</h4>
                <button onclick="closeDetails()" class="font-bold">✕</button>
            </div>
            <div class="p-4 space-y-4 overflow-y-auto">
                <div class="grid grid-cols-2 gap-2 text-center">
                    <div id="modalFPBox" class="p-3 rounded-xl border">FP: <span id="modalRemainingFP" class="font-black text-xl">0</span></div>
                    <div id="modalKHBox" class="p-3 rounded-xl border">KH: <span id="modalRemainingKH" class="font-black text-xl">0</span></div>
                </div>
                <div id="modalFormContainer"></div>
                <div id="modalHistoryContainer" class="space-y-1.5"></div>
            </div>
        </div>
    </div>

    <script>
        // --- LOGIKA APLIKACE ---
        let currentTargetId = null;

        function getTodayStr() { return new Date().toISOString().split('T')[0]; }

        function renderCounterTab() {
            const targets = JSON.parse(localStorage.getItem('dailyTargets') || '[]');
            const pickups = JSON.parse(localStorage.getItem('pickups') || '[]');
            const container = document.getElementById('activeCountersList');
            container.innerHTML = '';
            
            targets.filter(t => t.date === getTodayStr()).forEach(t => {
                const tPickups = pickups.filter(p => p.targetId === t.id);
                const remFP = Math.max(0, t.targetFP - tPickups.reduce((s, p) => s + p.fp, 0));
                const remKH = Math.max(0, t.targetKH - tPickups.reduce((s, p) => s + p.kh, 0));
                
                container.innerHTML += `
                    <div onclick="openDetails('${t.id}')" class="bg-white border p-3 rounded-xl cursor-pointer">
                        <div class="font-bold text-sm">${t.customer}</div>
                        <div class="text-[10px] text-gray-500">FP:${remFP} | KH:${remKH}</div>
                    </div>`;
            });
        }

        // FUNKCE UNDO
        function undoLastAction() {
            let pickups = JSON.parse(localStorage.getItem('pickups') || '[]');
            if (pickups.length > 0) {
                if(confirm("Opravdu smazat poslední zapsanou nakládku?")) {
                    pickups.pop();
                    localStorage.setItem('pickups', JSON.stringify(pickups));
                    renderCounterTab();
                }
            }
        }

        // FUNKCE SMAZÁNÍ KONKRÉTNÍHO ZÁZNAMU
        function deletePickup(pickupId) {
            if(!confirm("Smazat tento konkrétní záznam?")) return;
            let pickups = JSON.parse(localStorage.getItem('pickups') || '[]');
            pickups = pickups.filter(p => p.id !== pickupId);
            localStorage.setItem('pickups', JSON.stringify(pickups));
            renderCounterTab();
            renderModalContent();
        }

        function createDailyTarget() {
            const customer = document.getElementById('targetCustomer').value;
            const fp = parseInt(document.getElementById('targetFP').value) || 0;
            const kh = parseInt(document.getElementById('targetKH').value) || 0;
            let targets = JSON.parse(localStorage.getItem('dailyTargets') || '[]');
            targets.push({ id: Date.now().toString(), date: getTodayStr(), customer, targetFP: fp, targetKH: kh });
            localStorage.setItem('dailyTargets', JSON.stringify(targets));
            renderCounterTab();
        }

        function openDetails(id) { currentTargetId = id; document.getElementById('detailsModal').classList.replace('hidden', 'flex'); renderModalContent(); }
        function closeDetails() { document.getElementById('detailsModal').classList.replace('flex', 'hidden'); }

        function renderModalContent() {
            const targets = JSON.parse(localStorage.getItem('dailyTargets') || '[]');
            const t = targets.find(i => i.id === currentTargetId);
            const pickups = JSON.parse(localStorage.getItem('pickups') || '[]').filter(p => p.targetId === t.id);
            
            document.getElementById('modalCustomerName').textContent = t.customer;
            const hist = document.getElementById('modalHistoryContainer');
            hist.innerHTML = pickups.map(p => `
                <div class="flex justify-between items-center text-xs bg-gray-50 p-2 rounded">
                    <span>${p.driver}: ${p.fp}FP / ${p.kh}KH</span>
                    <button onclick="deletePickup('${p.id}')" class="text-red-500 font-bold px-2">✕</button>
                </div>`).join('');
        }

        // Inicializace
        document.getElementById('currentDateDisplay').textContent = new Date().toLocaleDateString('cs-CZ');
        document.getElementById('targetCustomer').innerHTML = JSON.parse(localStorage.getItem('customers') || '[]').map(c => `<option value="${c}">${c}</option>`).join('');
        renderCounterTab();
    </script>
</body>
</html>
