<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geis Dispečink</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">

    <header class="bg-white p-4 shadow rounded mb-4 border-b-4 border-[#96c11f]">
        <h1 class="font-black text-lg">Geis Dispečink</h1>
        <div class="flex justify-between mt-2">
            <button onclick="changeDay(-1)" class="bg-gray-200 px-4 py-1 rounded">◀</button>
            <span id="dateDisplay" class="font-bold"></span>
            <button onclick="changeDay(1)" class="bg-gray-200 px-4 py-1 rounded">▶</button>
        </div>
    </header>

    <div id="grid" class="grid grid-cols-2 gap-3"></div>

    <script>
        // 1. STAV APLIKACE
        let state = {
            currentDate: new Date(),
            pickups: JSON.parse(localStorage.getItem('pickups') || '[]')
        };

        // 2. FUNKCE PRO VYKRESLENÍ (Tato funkce teď existuje)
        function renderCounterTab() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '<div class="bg-white p-4 rounded shadow">Zákazník test (Datum: ' + state.currentDate.toLocaleDateString() + ')</div>';
            document.getElementById('dateDisplay').textContent = state.currentDate.toLocaleDateString('cs-CZ');
            console.log("Vykresleno dne:", state.currentDate);
        }

        // 3. NAVIGACE
        function changeDay(delta) {
            state.currentDate.setDate(state.currentDate.getDate() + delta);
            renderCounterTab();
        }

        // 4. SPUŠTĚNÍ PO NAČTENÍ
        window.onload = function() {
            renderCounterTab();
        };
    </script>
</body>
</html>
