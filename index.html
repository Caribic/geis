<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEIS SVOZY</title>
    
    <link class="js-manifest" rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#76c00e">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <div class="header-left">
            <img src="geis-logo.png" alt="Geis" class="logo">
            <span class="app-title">GEIS SVOZY</span>
        </div>
        <div class="current-date" id="dnesni-datum">PONDĚLÍ 29. ČERVNA 2026</div>
    </header>

    <main class="content">
        <section class="sekce-aktivace">
            <h3>AKTIVOVAT ZÁKAZNÍKA PRO DNEŠNÍ DEN</h3>
            <div class="card-form">
                <label for="main-select-zakaznik">ZÁKAZNÍK</label>
                <select id="main-select-zakaznik">
                    <option value="WIMEX">WIMEX</option>
                </select>
                
                <div class="input-row">
                    <div class="input-group">
                        <label>CÍL FP</label>
                        <input type="number" id="main-cil-fp" value="0" min="0" inputmode="numeric">
                    </div>
                    <div class="input-group">
                        <label>CÍL KH</label>
                        <input type="number" id="main-cil-kh" value="0" min="0" inputmode="numeric">
                    </div>
                </div>
                
                <button type="button" class="btn-aktivovat" onclick="aktivovatZakaznika()">
                    Přidat na přehled svozu
                </button>
            </div>
        </section>

        <section class="sekce-sledovani">
            <h3>DNEŠNÍ ACTIVE SLEDOVÁNÍ ODBĚRU</h3>
            <div id="zakaznici-list">
                </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <div class="nav-item active">
            <span class="nav-icon">⚃</span>
            <span class="nav-label">Mřížka</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">📊</span>
            <span class="nav-label">Statistiky</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">⚙</span>
            <span class="nav-label">Nastavení</span>
        </div>
    </nav>

    <div class="modal-backdrop" id="modal-backdrop" style="display: none;">
        <div class="modal-svoz">
            <div class="modal-header">
                <h2 id="modal-zakaznik-nazev">WIMEX</h2>
                <p id="modal-plan-info">Plán svozu: FP: 45 | KH: 0</p>
                <button type="button" class="btn-close" onclick="zavritModal()" aria-label="Zavřít">×</button>
            </div>

            <div class="modal-body">
                <div class="stav-palet-container">
                    <div class="stav-box">
                        <span class="stav-label">ZBÝVÁ ODVÉZT FP</span>
                        <span class="stav-cislo" id="zbyva-fp">30</span>
                    </div>
                    <div class="stav-box">
                        <span class="stav-label">ZBÝVÁ ODVÉZT KH</span>
                        <span class="stav-cislo" id="zbyva-kh">0</span>
                    </div>
                </div>

                <div class="form-nakladka">
                    <label>ZAPSAT NAKLÁDKU ŘIDIČE</label>
                    <div class="form-row">
                        <select id="select-ridic">
                            <option value="KINDA">KINDA</option>
                            <option value="DVOŘÁK">DVOŘÁK</option>
                            <option value="PUTERKA">PUTERKA</option>
                            <option value="VRABEC">VRABEC</option>
                            <option value="DOLEŽAL">DOLEŽAL</option>
                            <option value="KŘÍŽ">KŘÍŽ</option>
                            <option value="DUŽDA">DUŽDA</option>
                            <option value="VAŇÁTKO">VAŇÁTKO</option>
                            <option value="DAVID">DAVID</option>
                            <option value="BAŽANT">BAŽANT</option>
                            <option value="KLEIN">KLEIN</option>
                        </select>
                        <input type="number" id="input-fp" placeholder="0" min="0" inputmode="numeric">
                        <input type="number" id="input-kh" placeholder="0" min="0" inputmode="numeric">
                    </div>
                    <button type="button" class="btn-submit" onclick="potvrditNakladku()">
                        Potvrdit naložení a odečíst
                    </button>
                </div>

                <div class="historie-sekce">
                    <h3>HISTORIE DNEŠNÍCH NAKLÁDEK VOZIDEL:</h3>
                    <div id="historie-list">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
