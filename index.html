<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geis - Dispečink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden-tab { display: none; } .active-tab { display: block; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-50 font-sans pb-24">

    <header class="bg-white p-4 shadow-sm sticky top-0 z-10 border-b-4 border-[#96c11f]">
        <div class="flex items-center justify-between mb-2">
            <img src="geis-logo.png" class="h-6" alt="Geis">
            <button onclick="showCalendar()" class="text-slate-800">📅</button>
        </div>
        <div class="flex items-center justify-between">
            <button onclick="changeDay(-1)" class="font-bold text-lg px-2">◀</button>
            <div class="text-center">
                <h1 class="text-xs font-bold uppercase tracking-wider" id="currentDateDisplay"></h1>
            </div>
            <button onclick="changeDay(1)" class="font-bold text-lg px-2">▶</button>
        </div>
    </header>

    <main id="tab-counter" class="active-tab p-4 space-y-4">
        <button onclick="undoLastAction()" class="w-full bg-slate-200 text-slate-800 text-xs font-bold py-1 rounded">↶ Zpět (Undo poslední akce)</button>
        
        <div id="activeCountersList" class="grid grid-cols-2 gap-3"></div>
    </main>

    <script>
        let viewDate = new Date(); // Datum, které právě prohlížíme

        function changeDay(offset) {
            viewDate.setDate(viewDate.getDate() + offset);
            updateHeader();
            renderCounterTab();
        }

        function updateHeader() {
            document.getElementById('currentDateDisplay').textContent = viewDate.toLocaleDateString('cs-CZ', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        function undoLastAction() {
            let pickups = JSON.parse(localStorage.getItem('pickups')) || [];
            if (pickups.length > 0) {
                if(confirm("Opravdu smazat poslední zapsanou nakládku?")) {
                    pickups.pop();
                    localStorage.setItem('pickups', JSON.stringify(pickups));
                    renderCounterTab();
                }
            }
        }

        // Editace nakládky v historii:
        // V renderModalContent upravím historii tak, aby každý řádek měl tlačítko "Smazat/Editovat"
        // Po kliknutí na něj se hodnoty předvyplní do formuláře.

        function deletePickup(pickupId) {
            let pickups = JSON.parse(localStorage.getItem('pickups')) || [];
            pickups = pickups.filter(p => p.id !== pickupId);
            localStorage.setItem('pickups', JSON.stringify(pickups));
            renderCounterTab();
            renderModalContent();
        }

        // Vykreslení historie v detailu s tlačítkem pro smazání:
        // historyHtml += `<button onclick="deletePickup('${p.id}')" class="text-red-500">✕</button>`;

        updateHeader();
        renderCounterTab();
    </script>
</body>
</html>
