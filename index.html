<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geis - Dispečink Svozů</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .hidden-tab { display: none; }
        .active-tab { display: block; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-slate-900 pb-24">

    <header class="bg-white p-4 shadow-sm border-b-4 border-[#96c11f]">
        <div class="flex justify-between items-center mb-3">
            <div class="flex items-center gap-3">
                <img src="geis-logo.png" alt="Geis" class="h-8 w-auto" onerror="this.style.display='none'">
                <h1 class="text-lg font-black uppercase tracking-tight">Geis Svozy</h1>
            </div>
            <button onclick="document.getElementById('datePicker').showPicker()" class="text-2xl">📅</button>
            <input type="date" id="datePicker" class="hidden" onchange="jumpToDate(this.value)">
        </div>
        <div class="flex justify-between items-center">
            <button onclick="changeDay(-1)" class="bg-gray-200 px-4 py-1 rounded font-bold">◀</button>
            <span id="currentDateDisplay" class="font-bold text-sm"></span>
            <button onclick="changeDay(1)" class="bg-gray-200 px-4 py-1 rounded font-bold">▶</button>
        </div>
    </header>

    <main id="tab-counter" class="active-tab p-4 space-y-4">
        <button onclick="undoLastAction()" class="w-full bg-red-50 text-red-600 text-[10px] font-bold py-2 rounded border border-red-200">↶ ZPĚT (Smazat poslední nakládku)</button>
        <div id="activeCountersList" class="grid grid-cols-2 gap-3"></div>
    </main>

    <main id="tab-stats" class="hidden-tab p-4 space-y-4">
        <h2 class="text-lg font-bold uppercase">Graf výkonu (FP)</h2>
        <div class="bg-white p-4 rounded-xl shadow-sm border">
            <canvas id="statsChart"></canvas>
        </div>
    </main>

    <div id="detailsModal" class="fixed inset-0 z-50 bg-slate-900/60 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md p-4 max-h-[90vh] overflow-y-auto">
            <h4 id="modalCustomerName" class="font-black uppercase mb-4">---</h4>
            <div id="modalFormContainer" class="space-y-3 border-b pb-4"></div>
            <div id="modalHistoryContainer" class="space-y-2 mt-4"></div>
            <button onclick="closeDetails()" class="w-full mt-6 bg-slate-800 text-white py-2 rounded">Zavřít</button>
        </div>
    </div>

    <nav class="fixed bottom-0 w-full bg-white border-t p-3 flex justify-around shadow-lg">
        <button onclick="switchTab('counter')" class="font-bold text-[#96c11f]">SVOZY</button>
        <button onclick="switchTab('stats')" class="font-bold text-gray-400">GRAFY</button>
    </nav>

    <script>
        let currentDate = new Date();
        
        function updateDateDisplay() {
            document.getElementById('currentDateDisplay').textContent = currentDate.toLocaleDateString('cs-CZ');
            renderCounterTab();
        }

        function changeDay(offset) {
            currentDate.setDate(currentDate.getDate() + offset);
            updateDateDisplay();
        }

        function jumpToDate(dateStr) {
            currentDate = new Date(dateStr);
            updateDateDisplay();
        }

        function renderCounterTab() {
            const container = document.getElementById('activeCountersList');
            container.innerHTML = '';
            const targets = JSON.parse(localStorage.getItem('dailyTargets') || '[]');
            const pickups = JSON.parse(localStorage.getItem('pickups') || '[]');
            
            targets.filter(t => t.date === currentDate.toISOString().split('T')[0]).forEach(t => {
                const tPickups = pickups.filter(p => p.targetId === t.id);
                const remFP = Math.max(0, t.targetFP - tPickups.reduce((s, p) => s + p.fp, 0));
                
                container.innerHTML += `
                    <div onclick="openDetails('${t.id}')" class="bg-white border p-3 rounded-xl cursor-pointer shadow-sm">
                        <div class="font-bold text-sm truncate">${t.customer}</div>
                        <div class="text-[10px] text-gray-500">Zbývá FP: ${remFP}</div>
                    </div>`;
            });
        }

        function undoLastAction() {
            let p = JSON.parse(localStorage.getItem('pickups') || '[]');
            if(p.length > 0 && confirm("Smazat poslední nakládku?")) {
                p.pop();
                localStorage.setItem('pickups', JSON.stringify(p));
                renderCounterTab();
            }
        }

        function deletePickup(pickupId) {
            if(!confirm("Smazat tento záznam?")) return;
            let p = JSON.parse(localStorage.getItem('pickups') || '[]');
            p = p.filter(item => item.id !== pickupId);
            localStorage.setItem('pickups', JSON.stringify(p));
            renderCounterTab();
            renderModalContent(); // Funkce pro obnovu modálu
        }

        function switchTab(tabId) {
            document.getElementById('tab-counter').classList.toggle('active-tab', tabId === 'counter');
            document.getElementById('tab-counter').classList.toggle('hidden-tab', tabId !== 'counter');
            document.getElementById('tab-stats').classList.toggle('active-tab', tabId === 'stats');
            document.getElementById('tab-stats').classList.toggle('hidden-tab', tabId !== 'stats');
            if(tabId === 'stats') renderChart();
        }

        function renderChart() {
            const pickups = JSON.parse(localStorage.getItem('pickups') || '[]');
            const driverData = {};
            pickups.forEach(p => driverData[p.driver] = (driverData[p.driver] || 0) + p.fp);
            
            const ctx = document.getElementById('statsChart').getContext('2d');
            if(window.myChart) window.myChart.destroy();
            window.myChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: Object.keys(driverData), datasets: [{ label: 'Odvezené FP', data: Object.values(driverData), backgroundColor: '#96c11f' }] }
            });
        }

        // Inicializace
        updateDateDisplay();
    </script>
</body>
</html>
