<button onclick="undoLastAction()" class="w-full bg-red-50 text-red-600 text-[10px] font-bold py-1.5 rounded-lg border border-red-200 mb-2 active:bg-red-100">
    ↶ ZPĚT (Smazat poslední nakládku)
</button>

<script>
    // 1. FUNKCE ZPĚT (Smaže poslední provedený zápis)
    function undoLastAction() {
        let pickups = JSON.parse(localStorage.getItem('pickups') || '[]');
        if (pickups.length > 0) {
            if(confirm("Opravdu smazat poslední zapsanou nakládku?")) {
                pickups.pop(); // Smaže poslední prvek
                localStorage.setItem('pickups', JSON.stringify(pickups));
                renderCounterTab();
            }
        } else {
            alert("Žádná historie k vrácení.");
        }
    }

    // 2. FUNKCE PRO SMAZÁNÍ/EDITACI konkrétního řádku v historii
    function deletePickup(pickupId) {
        if(!confirm("Smazat tento záznam o nakládce?")) return;
        let pickups = JSON.parse(localStorage.getItem('pickups') || '[]');
        pickups = pickups.filter(p => p.id !== pickupId);
        localStorage.setItem('pickups', JSON.stringify(pickups));
        
        // Obnovit pohledy
        renderCounterTab();
        renderModalContent();
    }

    // UPRAVENÁ FUNKCE renderModalContent (Zde nahraď původní vykreslování historie)
    // Uvnitř renderModalContent najdi část "Historie dnešních nakládek" a uprav ji takto:

</script>
