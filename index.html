<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geis - Dispečink</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans pb-24">

    <header class="bg-white shadow-sm p-4 border-b-4 border-[#96c11f]">
        <div class="flex justify-between items-center mb-3">
            <img src="geis-logo.png" class="h-8" alt="Geis">
            <input type="date" id="calendarPicker" class="hidden" onchange="jumpToDate(this.value)">
            <button onclick="document.getElementById('calendarPicker').showPicker()" class="text-2xl">📅</button>
        </div>
        <div class="flex justify-between items-center">
            <button onclick="changeDay(-1)" class="bg-gray-200 px-4 py-1 rounded font-bold">◀</button>
            <h2 id="dateDisplay" class="font-bold text-slate-800">---</h2>
            <button onclick="changeDay(1)" class="bg-gray-200 px-4 py-1 rounded font-bold">▶</button>
        </div>
    </header>

    <main class="p-4">
        <button onclick="undo()" class="w-full bg-red-100 text-red-700 py-2 rounded font-bold mb-4 text-sm">↶ Zpět (Undo)</button>
        <div id="grid" class="grid grid-cols-2 gap-3"></div>
    </main>

    <div id="modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl w-full p-4 max-h-[80vh] overflow-y-auto">
            <h3 id="modalTitle" class="text-lg font-black mb-4">---</h3>
            <div id="historyList" class="space-y-2"></div>
            <button onclick="document.getElementById('modal').classList.add('hidden')" class="mt-4 w-full bg-gray-800 text-white py-2 rounded">Zavřít</button>
        </div>
    </div>

    <script>
        let viewDate = new Date();

        function updateDateDisplay() {
            document.getElementById('dateDisplay').textContent = viewDate.toLocaleDateString('cs-CZ');
        }

        function changeDay(delta) {
            viewDate.setDate(viewDate.getDate() + delta);
            updateDateDisplay();
            render();
        }

        function jumpToDate(dateStr) {
            viewDate = new Date(dateStr);
            updateDateDisplay();
            render();
        }

        function undo() {
            let p = JSON.parse(localStorage.getItem('pickups') || '[]');
            if(p.length > 0) {
                p.pop();
                localStorage.setItem('pickups', JSON.stringify(p));
                render();
            }
        }

        function deleteRecord(id) {
            let p = JSON.parse(localStorage.getItem('pickups') || '[]');
            p = p.filter(item => item.id !== id);
            localStorage.setItem('pickups', JSON.stringify(p));
            render();
            // Po smazání aktualizuj modál
            showModal(currentTarget);
        }

        function render() {
            // Logika vykreslení mřížky podle viewDate
            // ... (zde bude kód pro zobrazení dlaždic)
        }

        updateDateDisplay();
    </script>
</body>
</html>
