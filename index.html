<header class="bg-white p-4 shadow-sm border-b-4 border-[#96c11f]">
    <div class="flex justify-between items-center mb-2">
        <img src="geis-logo.png" class="h-6" alt="Geis">
        <input type="date" id="datePicker" class="hidden" onchange="jumpToDate(this.value)">
        <button onclick="document.getElementById('datePicker').showPicker()" class="text-xl">📅</button>
    </div>
    <div class="flex justify-between items-center">
        <button onclick="changeDay(-1)" class="font-bold p-2">◀</button>
        <h1 id="currentDateDisplay" class="font-bold text-sm uppercase"></h1>
        <button onclick="changeDay(1)" class="font-bold p-2">▶</button>
    </div>
</header>

<button onclick="undoLastAction()" class="w-full bg-red-50 text-red-600 text-[10px] font-bold py-1 rounded border border-red-200 mb-2">↶ ZPĚT (Smazat poslední nakládku)</button>

<script>
    let currentDate = new Date(); // Místo původního 'today'

    function updateDateDisplay() {
        document.getElementById('currentDateDisplay').textContent = currentDate.toLocaleDateString('cs-CZ', { day: 'numeric', month: 'long' });
        renderCounterTab();
    }

    function changeDay(offset) {
        currentDate.setDate(currentDate.getDate() + offset);
        updateDateDisplay();
    }

    function jumpToDate(dateStr) {
        currentDate = new Date(dateStr);
        updateDateDisplay();
    }

    // PŘEPISOVAT FUNKCI: getTodayStr by nyní měla vracet formátované datum z currentDate
    const getTodayStr = () => currentDate.toISOString().split('T')[0];

    function undoLastAction() {
        if(!confirm("Opravdu smazat poslední zapsanou nakládku?")) return;
        let pickups = JSON.parse(localStorage.getItem('pickups')) || [];
        pickups.pop(); // Smaže poslední prvek
        localStorage.setItem('pickups', JSON.stringify(pickups));
        renderCounterTab();
    }

    // PŘEPISOVAT FUNKCI: renderModalContent (doplnit tlačítko smazat k historii)
    // Uvnitř cyklu tPickups.forEach přidej:
    /*
    historyHtml += `
        <div class="flex justify-between items-center text-xs bg-white p-2.5 rounded-lg border border-gray-200">
            <span>${p.driver}: ${p.fp} FP | ${p.kh} KH</span>
            <button onclick="deletePickup('${p.id}')" class="text-red-500 font-bold">✕</button>
        </div>`;
    */

    function deletePickup(pickupId) {
        let pickups = JSON.parse(localStorage.getItem('pickups')) || [];
        pickups = pickups.filter(p => p.id !== pickupId);
        localStorage.setItem('pickups', JSON.stringify(pickups));
        renderModalContent(); // Aktualizuje modál
        renderCounterTab();   // Aktualizuje hlavní mřížku
    }
</script>
